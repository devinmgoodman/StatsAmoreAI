name: Deploy
# SECURITY: the `api` job runs on the self-hosted Mac Mini runner. Only ever trigger it from
# pushes to main (never pull_request / pull_request_target), and keep the repo setting
# "Require approval for all outside collaborators" on for fork PR workflows.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    runs-on: [self-hosted, macOS, statsamore-prod]
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate, restart, health check (auto-rollback)
        env:
          IMAGE_TAG: ${{ github.sha }}
          PROD_ENV_FILE: ${{ vars.PROD_ENV_FILE }}
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: ./ops/deploy.sh

  frontend:
    needs: api # only ship the UI once the API it expects is live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - name: Upload to SiteGround
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_KNOWN_HOSTS: ${{ secrets.SG_KNOWN_HOSTS }}
          SG_PORT: ${{ vars.SG_PORT }}
          SG_WEB_ROOT: ${{ vars.SG_WEB_ROOT }} # dedicated dir for this site, e.g. ~/www/statsamore.com/public_html
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/sg_key && chmod 600 ~/.ssh/sg_key
          printf '%s\n' "$SG_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlptz --delete --exclude='.well-known' --exclude='cgi-bin' \
            -e "ssh -i ~/.ssh/sg_key -p ${SG_PORT:-18765} -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$SG_USER@$SG_HOST:$SG_WEB_ROOT/"
