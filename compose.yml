networks:
  backend_net:
    driver: bridge
    internal: true # postgres <-> backend only; no host or outbound access
  frontend_net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: stats-amore-postgres
    restart: unless-stopped
    env_file: .env.dev # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql/data # named volume: avoids macOS bind-mount perms/perf issues
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
    container_name: stats-amore-backend
    restart: unless-stopped
    env_file: .env.dev # DB_HOST=postgres, DB_*, PORT=8080, CORS_ORIGIN
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/app:cached
      - backend-node-modules:/app/node_modules # container-arch deps; rebuild with `docker compose up --build -V` after package.json changes
    networks:
      - backend_net
      - frontend_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: stats-amore-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app:cached
      - frontend-node-modules:/app/node_modules
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
